name: Strict platform first-retest research scan
on:
  push:
    branches:
      - research/strict-platform-screen-20261126
  workflow_dispatch:
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install research dependencies
        run: pip install numpy pandas pyarrow requests
      - name: Scan public S&P500/Nasdaq100 OHLC data
        run: python stock_research/strict_platform_scan.py
      - name: Save complete candidate and failure report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: strict-platform-scan-results
          path: strict_platform_results.json
          if-no-files-found: warn
          retention-days: 7
